[project]
name = "transcription-worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rex Lorenzo", email = "rexlorenzo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "mlx-whisper>=0.4.3",
    "onnx-asr>=0.12.0",
    "parakeet-mlx>=0.5.2",
    "pyannote-audio>=4.0.7",
]

[project.scripts]
transcription-worker = "transcription_worker.__main__:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
extend = "../pyproject.toml"
target-version = "py312"  # PEP 758 except-without-parens is 3.14-only; keep tuples here
